services:
  planka-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: planka-mcp:latest
    container_name: planka-mcp
    restart: unless-stopped
    ports:
      # PLANKA_MCP_PORT only changes the HOST-side port. The container always
      # listens on 3008 internally (env below), so the healthcheck stays fixed.
      - "${PLANKA_MCP_PORT:-3008}:3008"
    environment:
      - PLANKA_BASE_URL=${PLANKA_BASE_URL}
      - PLANKA_AGENT_EMAIL=${PLANKA_AGENT_EMAIL}
      - PLANKA_AGENT_PASSWORD=${PLANKA_AGENT_PASSWORD}
      # Fixed internal listen port; the host mapping above is what you change.
      - PLANKA_MCP_PORT=3008
      - PLANKA_MCP_TOKEN=${PLANKA_MCP_TOKEN}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - attachments:/app/attachments
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  attachments:
